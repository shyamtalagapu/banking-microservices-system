spring.kafka.bootstrap-servers=kafka:9092

spring.kafka.consumer.group-id=transaction-details-group

spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer

spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer

spring.kafka.consumer.properties.spring.json.value.default.type=com.banking.common.events.events.MoneyDepositedEvent

spring.kafka.consumer.properties.spring.json.trusted.packages=com.banking.common.events.events

spring.kafka.consumer.auto-offset-reset=earliest